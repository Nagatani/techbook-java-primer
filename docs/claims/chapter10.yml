# 第10章の主張と、その確かめ方（node scripts/check-claims.js ch10）
jdk: 25
claims:
  - id: generics-5
    claim: ジェネリクスはJava 5（J2SE 5.0、2004年）で導入され、それより前のコレクションはObject型の入れ物だった
    text:
      - Java 5より前は、コレクションは「あらゆるオブジェクト」を格納できるObject型の入れ物で
      - Java 5で導入されたのがジェネリクス（Generics）です
      - J2SE 5.0（2004年）で加わりました
    sources:
      - title: New Features and Enhancements J2SE 5.0（Oracle）
        url: https://docs.oracle.com/javase/1.5.0/docs/relnotes/features.html
        anchor: Generics
      - title: Generics（J2SE 5.0 の解説、Oracle）
        url: https://docs.oracle.com/javase/1.5.0/docs/guide/language/generics.html
        anchor: pre-5.0 virtual machine
      - title: JSR 176 J2SE 5.0 (Tiger) Release Contents（JCP）
        url: https://jcp.org/en/jsr/detail?id=176
        anchor: 30 Sep, 2004
    verify:
      kind: manual
      checked: 2026-11-19
      note: J2SE 5.0の新機能の一覧にGenerics（JSR 14）があり、解説はジェネリクス以前のコードとしてObjectからキャストする例を示していること、JSR 176のFinal Releaseが2004年9月30日であることを確かめた

  - id: generics-compile-8
    claim: ジェネリクスとダイヤモンドはJava 8より前からある（--release 8で通る）
    text: Java 7からは、右辺の型引数を省略できるダイヤモンド演算子
    verify:
      kind: since
      probe: Generics.java
      version: 8
      note: Java 7以前は--releaseに指定できないので、8で通ることだけを確かめる

  - id: diamond-7
    claim: ダイヤモンド（右辺の型引数の省略）はJava 7で導入された
    text: Java 7からは、右辺の型引数を省略できるダイヤモンド演算子
    sources:
      - title: Java Programming Language Enhancements（Java SE 7、Oracle）
        url: https://docs.oracle.com/javase/7/docs/technotes/guides/language/enhancements.html
        anchor: Type Inference for Generic Instance Creation
    verify:
      kind: manual
      checked: 2026-11-19
      note: 「Enhancements in Java SE 7」に、ジェネリクスのインスタンス生成の型推論（the diamond）があることを確かめた

  - id: var-10
    claim: ローカル変数の型推論varはJava 10で導入された（JEP 286）
    text: Java 10で導入されたvar型推論
    sources:
      - title: JEP 286 Local-Variable Type Inference
        url: https://openjdk.org/jeps/286
        anchor: Release 10
    verify:
      kind: since
      probe: VarLocal.java
      version: 10
      expect: ['cannot find symbol[\s\S]*class var']

  - id: var-lambda-11
    claim: ラムダ式の引数にvarを使えるのはJava 11以降（JEP 323）
    text: ラムダ式（第11章）の引数（Java 11以降）
    sources:
      - title: JEP 323 Local-Variable Syntax for Lambda Parameters
        url: https://openjdk.org/jeps/323
        anchor: Release 11
    verify:
      kind: since
      probe: VarLambda.java
      version: 11
      expect: ["var syntax in implicit lambdas are not supported"]

  # ---- 版以外の主張（2026-11-24、Issue #034）
  - id: generics-invariance
    claim: IntegerはNumberのサブクラスだが、List<Number>の引数にList<Integer>を渡すとコンパイルエラーになる
    text: ところが、List<Number>型の引数にList<Integer>を渡すと、コンパイルエラーになります
    sources:
      - title: JLS 25 4.10.2 Subtyping among Class and Interface Types
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html
    verify:
      kind: javac
      probe: compile-errors/ListInvariance.java
      fails: true
      expect: ['List<Integer> cannot be converted to List<Number>']

  - id: unbounded-wildcard-add
    claim: List<?>にはnull以外の要素を追加できない（nullは追加できる）
    text: ただし、要素の型がわからないため、安全のためにnull以外の要素は追加できません
    verify:
      kind: javac
      probe: compile-errors/UnknownAdd.java
      fails: true
      expect: ['String cannot be converted to CAP#1']

  - id: unbounded-wildcard-add-null
    claim: List<?>にnullは追加できる
    text: ただし、要素の型がわからないため、安全のためにnull以外の要素は追加できません
    verify:
      kind: run
      probe: WildcardFacts.java
      expect: ['^List<\?>.add\(null\): 1$']

  - id: bounded-wildcards
    claim: List<? extends Number>はNumberのサブクラスの要素のリストを受け取りNumberとして読める。List<? super Integer>はList<Number>やList<Object>を受け取り、Integerを追加できる
    text:
      - たとえばList<? extends Number>は、要素の型がNumber・Integer・Doubleのリストを受け取れます
      - List<? super Integer>は、要素の型がInteger・Number・Objectのリストを受け取れます
    verify:
      kind: run
      probe: WildcardFacts.java
      expect:
        - '^extends: 3\.0 1\.5$'
        - '^super: \[1\] \[1\]$'

  - id: pecs-effective-java-2
    claim: PECSはジョシュア・ブロックが『Effective Java』第2版（2008年）で紹介した覚え方
    text: ジョシュア・ブロックが著書『Effective Java』の第2版（2008年）で紹介した覚え方です
    sources:
      - title: Effective Java, 2nd Edition（Addison-Wesley、2008年）
        url: https://www.oracle.com/java/technologies/effectivejava.html
    verify:
      kind: manual
      checked: 2026-11-24
      note: 第2版（2008年5月）の項目28「Use bounded wildcards to increase API flexibility」でPECS（producer-extends, consumer-super）を示している。第3版（2018年）では項目31

  - id: var-allowed-places
    claim: varはローカル変数、for文・拡張for文の変数、try-with-resourcesのリソース変数、ラムダ式の引数（Java 11以降）に使える。varという名前の変数も使える
    text:
      - for文・拡張for文のループ変数
      - try-with-resources文（第13章）のリソース変数
      - varは通常のキーワードではなく、型を書く位置でだけ特別な意味を持つ語なので、varという名前の変数を使った古いコードもそのまま動きます
    sources:
      - title: JLS 25 3.9 Keywords
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-3.html
        anchor: var
    verify:
      kind: run
      probe: WildcardFacts.java
      expect: ['^var as a variable name: 3$']

  - id: var-not-field
    claim: varはフィールドの型に使えない
    text: 一方、以下の場面では使用できません
    verify:
      kind: javac
      probe: compile-errors/VarField.java
      fails: true
      expect: ["'var' is not allowed here"]

  - id: var-no-initializer
    claim: 初期値のないvarはコンパイルエラーになる
    text: 一方、以下の場面では使用できません
    verify:
      kind: javac
      probe: compile-errors/VarNoInit.java
      fails: true
      expect: ['cannot infer type for local variable x']

  - id: var-null
    claim: nullで初期化するvarはコンパイルエラーになる
    text: 一方、以下の場面では使用できません
    verify:
      kind: javac
      probe: compile-errors/VarNull.java
      fails: true
      expect: ['cannot infer type for local variable x']

  - id: var-array-initializer
    claim: 配列初期化子だけのvarはコンパイルエラーになる
    text: 一方、以下の場面では使用できません
    verify:
      kind: javac
      probe: compile-errors/VarArrayInit.java
      fails: true
      expect: ['cannot infer type for local variable x']

  - id: var-diamond-object
    claim: var list = new ArrayList<>()はArrayList<Object>と推論され、どんな型の要素も入る
    text: 一方、以下の場面では使用できません
    verify:
      kind: run
      probe: WildcardFacts.java
      expect: ['^var with <>: \[1, s\]$']
