# 第9章の主張と、その確かめ方（node scripts/check-claims.js ch09）
jdk: 25
claims:
  - id: collections-framework-1-2
    claim: コレクションフレームワークはJava 1.2で加わり、設計の中心はジョシュア・ブロックだった
    text: コレクションフレームワークはJava 1.2（1998年）で加わりました
    sources:
      - title: java.util.Collection（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Collection.html
        anchor: Collections Framework
    verify:
      kind: manual
      checked: 2026-11-19
      note: src.zipの@since（Collection・List・ArrayListは1.2）と、Collection.javaの@author Josh Blochで確かめた。--release 8で通ることはLegacyCollectionsで確かめる

  - id: collections-framework-1998
    claim: Java 1.2（J2SE 1.2）は1998年に公開された
    text: コレクションフレームワークはJava 1.2（1998年）で加わりました
    sources:
      - title: Vladimir Ivanov, Java 20 years（Oracle, 2015。OpenJDKのサーバーにある講演資料）
        url: https://cr.openjdk.org/~vlivanov/talks/2015_Java_20_years_Minsk.pdf
    verify:
      kind: manual
      checked: 2026-11-19
      note: 資料の15ページに「1998 J2SE 1.2 December 8」とある（PDFの文字をPDFKitで取り出して確かめた）。Oracle・OpenJDKのHTMLの文書でJ2SE 1.2の公開年を示すものは見つからなかった

  - id: collections-author-bloch
    claim: java.util.Collectionのソースコードの@authorにJosh Blochの名前がある。Blochはのちに『Effective Java』（Addison-Wesley、2001年）を著した
    text: java.util.Collectionなどのソースコードには、作者として、のちに『Effective Java』を著すジョシュア・ブロックの名前があります
    sources:
      - title: JDK 25のソースコード java.base/java/util/Collection.java（JDKのlib/src.zip）
      - title: "Joshua Bloch, Effective Java Programming Language Guide, Addison-Wesley, 2001"
    verify:
      kind: manual
      checked: 2026-11-19
      note: JDK 25.0.2のlib/src.zipのjava/util/Collection.javaに「@author Josh Bloch」「@author Neal Gafter」「@since 1.2」があることを確かめた

  - id: vector-hashtable-1-0
    claim: VectorとHashtableはJava 1.0からある
    text: 2つのクラスはJava 1.0からあり
    sources:
      - title: java.util.Vector（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Vector.html
        anchor: "1.0"
      - title: java.util.Hashtable（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Hashtable.html
        anchor: "1.0"
    verify:
      kind: manual
      checked: 2026-11-19
      note: src.zipの@since（Vector・Hashtableとも1.0）で確かめた

  - id: legacy-compiles-8
    claim: Vector・Hashtable・コレクションフレームワーク・オートボクシング・拡張for文はJava 8より前からある（--release 8で通る）
    text: 2つのクラスはJava 1.0からあり
    verify:
      kind: since
      probe: LegacyCollections.java
      version: 8

  - id: autoboxing-5
    claim: オートボクシングはJ2SE 5.0（2004年）で、ジェネリクスと同時に加わった
    text: J2SE 5.0（2004年）で、ジェネリクスと同時に加わりました
    sources:
      - title: New Features and Enhancements J2SE 5.0（Oracle）
        url: https://docs.oracle.com/javase/1.5.0/docs/relnotes/features.html
        anchor: Autoboxing/Unboxing
      - title: JSR 176 J2SE 5.0 (Tiger) Release Contents（JCP）
        url: https://jcp.org/en/jsr/detail?id=176
        anchor: 30 Sep, 2004
    verify:
      kind: manual
      checked: 2026-11-19
      note: J2SE 5.0の新機能の一覧にGenerics・Enhanced for Loop・Autoboxing/Unboxingが並んでいること、JSR 176のFinal Releaseが2004年9月30日であることを確かめた

  - id: stream-8
    claim: Stream APIはJava 8で導入された
    text: Java 8で導入されたStream APIは
    verify:
      kind: since
      probe: StreamApi.java
      version: 8
      note: src.zipの@since（Streamは1.8）。Java 7は--releaseに指定できないので、8で通ることだけを確かめる

  - id: immutable-factory-9
    claim: List.of・Set.of・Map.ofで不変コレクションを作れるのはJava 9以降
    text: Java 9以降、不変（Immutable）コレクションの作成が簡単になりました
    sources:
      - title: JEP 269 Convenience Factory Methods for Collections
        url: https://openjdk.org/jeps/269
        anchor: Release 9
    verify:
      kind: since
      probe: ImmutableFactory.java
      version: 9
      expect: ['cannot find symbol']

  - id: sequenced-21
    claim: SequencedCollection・SequencedSet・SequencedMapはJava 21で加わった（JEP 431）
    text: Java 21では、要素の並び順が決まっているコレクションに共通するインターフェイスとして
    sources:
      - title: JEP 431 Sequenced Collections
        url: https://openjdk.org/jeps/431
        anchor: Release 21
    verify:
      kind: since
      probe: Sequenced.java
      version: 21
      expect: ['cannot find symbol']

  # ---- 版以外の主張（2026-11-24、Issue #034）
  - id: integer-cache
    claim: Integerの-128〜127はキャッシュされた同じオブジェクトになるので==がtrueになり、それ以外ではfalseになりうる
    text: -128〜127の値は同じオブジェクトが使い回されるので==でもtrueになることがあり
    sources:
      - title: Integer.valueOf(int)（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Integer.html
        anchor: This method will always cache values in the range -128 to 127
    verify:
      kind: run
      probe: CollectionFacts.java
      expect: ['^127==127: true, 128==128: false, equals: true$']

  - id: unbox-null
    claim: nullのIntegerをintに変換するとNullPointerExceptionになる
    text: 中身がnullのIntegerをintに変換しようとすると、NullPointerExceptionが発生する
    verify:
      kind: run
      probe: CollectionFacts.java
      expect: ['^unbox null -> NullPointerException$']

  - id: list-remove-overload
    claim: List<Integer>のremoveにintを渡すとインデックスの削除が選ばれる
    text: remove(int index)とremove(Object o)の2つがあり、intを渡すと前者が選ばれる
    verify:
      kind: run
      probe: CollectionFacts.java
      expect:
        - '^remove\(1\): \[5, 7\]$'
        - '^remove\(Integer.valueOf\(7\)\): \[5\]$'

  - id: set-null
    claim: Comparatorなしで作ったTreeSetのadd(null)はNullPointerException、HashSetはnullを1つだけ持てる
    text:
      - nullはほかの要素と比べられないため、add(null)はNullPointerExceptionになります
      - HashSetはnullを要素として扱えるので、nullを1つだけ入れられます
    verify:
      kind: run
      probe: CollectionFacts.java
      expect:
        - '^TreeSet.add\(null\) -> NullPointerException$'
        - '^HashSet nulls: 1$'

  - id: linkedhashmap-access-order
    claim: LinkedHashMapのコンストラクターの3つめの引数にtrueを渡すと、並び順がアクセス順になる
    text: コンストラクターの3つめの引数にtrueを渡して並び順をアクセス順にし
    sources:
      - title: LinkedHashMap（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/LinkedHashMap.html
        anchor: removeEldestEntry
    verify:
      kind: run
      probe: CollectionFacts.java
      expect: ['^access order: \[B, C, A\]$']

  - id: fail-fast
    claim: 拡張for文の途中で要素を削除すると多くの場合ConcurrentModificationExceptionになるが、最後から2番目の要素を削除すると例外が起きず残りが飛ばされる。イテレーターのremoveなら例外にならない
    text:
      - 削除すると、多くの場合、次の要素を取り出すときにConcurrentModificationExceptionが発生します
      - 最後から2番目の要素を削除したときのように、例外が起きずに残りの要素が飛ばされることもあります
      - イテレーターのremove()で削除すれば、走査中に要素を消してもConcurrentModificationExceptionは発生しません
    verify:
      kind: run
      probe: CollectionFacts.java
      expect:
        - '^remove in for-each -> ConcurrentModificationException$'
        - '^remove second-to-last: \[a, b, d\]$'
        - '^iterator remove: \[a, c, d\]$'

  - id: arraylist-linkedlist-get
    claim: ArrayListのgetは要素数によらずほぼ一定の時間、LinkedListのgetは要素数に比例して時間が増える
    text: その位置までたどるのに時間がかかる
    verify:
      kind: run
      probe: ComplexityProbe.java
      expect:
        - '^ArrayList.get x10 elements: ほぼ一定$'
        - '^LinkedList.get x10 elements: 大きく増えた$'
      attempts: 3

  - id: entryset-faster
    claim: すべての要素を走査するとき、keySetでキーごとにgetするよりentrySetのほうが速い
    text: すべての要素を走査するときは、keySet()よりentrySet()を使うほうが速くなります
    verify:
      kind: run
      probe: LegacySpeed.java
      expect: ['^entrySet faster than keySet\+get \(5 rounds\): [45]$']
      attempts: 3

  - id: vector-single-thread
    claim: Vectorはすべてのメソッドが同期されているが、JDK 25で1つのスレッドから使ったとき、ArrayListとの差はほとんど出ないこともある
    text: 同期には手間がかかるので、1つのスレッドで使うとArrayListやHashMapより遅くなることがありますが、いまのJVMでは差がほとんど出ないこともあります
    sources:
      - title: Vector（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Vector.html
        anchor: Vector is synchronized
    verify:
      kind: manual
      checked: 2026-11-24
      note: LegacySpeed.javaで100万要素の追加と取得を5回比べると、Vectorが遅かったのは2〜3回で、ほぼ同じ速さだった（2026-11-24、JDK 25、macOS/AArch64）。以前の本文の「遅くなる」だけの書き方を直した
