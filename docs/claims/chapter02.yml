# 第2章の主張と、その確かめ方（node scripts/check-claims.js ch02）
jdk: 25
claims:
  - id: switch-expression-14
    claim: switch式はJava 14で正式な機能になった
    text: Java 14からは、switchを値を返す「式」として書けるようになりました
    verify:
      kind: since
      probe: SwitchExpression.java
      version: 14
      expect: ['switch expressions|preview']

  - id: switch-expression-preview-12-13
    claim: switch式はJava 12と13でプレビュー機能として提供され、Java 14で正式になった（JEP 361）
    text: switch式はJava 12と13でプレビュー機能（試験的に使える機能）として提供され、Java 14で正式な機能になりました（JEP 361）
    sources:
      - title: "JEP 361: Switch Expressions"
        url: https://openjdk.org/jeps/361
        anchor: JEP 325 was targeted to JDK 12 in August 2018 as a preview feature
      - title: "JEP 354: Switch Expressions (Second Preview)"
        url: https://openjdk.org/jeps/354
        anchor: Release 13
    verify:
      kind: manual
      checked: 2026-11-19
      note: JEP 361のHistory（JEP 325がJDK 12、JEP 354がJDK 13のプレビュー）で確かめた。JDK 25のjavacは--release 13で「not supported in -source 13」と報告し、プレビューだったことは示さない

  - id: var-10
    claim: varはJava 10から使える
    text: Java 10からは型の代わりにvarと書いて、初期値から型をコンパイラーに推論させることもできます
    verify:
      kind: since
      probe: Var.java
      version: 10
      expect: ['cannot find symbol']

  - id: underscore-keyword-9
    claim: Java 9から、単独の_は予約語で名前に使えない
    text: 単独の_（アンダースコア）は名前に使えない（Java 9から予約語。
    verify:
      kind: javac
      probe: Underscore.java
      release: 9
      fails: true
      expect: ["as of release 9, '_' is a keyword, and may not be used as an identifier"]

  - id: underscore-identifier-8
    claim: Java 8までは、単独の_を名前に使えた（警告だけ）
    text: 単独の_（アンダースコア）は名前に使えない（Java 9から予約語。
    verify:
      kind: javac
      probe: Underscore.java
      release: 8
      expect: ["warning: as of release 9, '_' is a keyword"]

  - id: io-class-25
    claim: java.langのIOクラスはJava 25で加わった
    text: 本書では標準入出力にJava 25のIOクラス
    verify:
      kind: since
      probe: IoClass.java
      version: 25
      expect: ['cannot find symbol']

  - id: strip-11
    claim: String.stripはJava 11で加わった
    text: strip()はJava 11で加わったメソッドで
    verify:
      kind: since
      probe: Strip.java
      version: 11
      expect: ['cannot find symbol']

  - id: java5-features
    claim: 拡張for文・ジェネリクス・enumはJava 5で導入された
    text: 拡張for文は、2004年のJava 5で導入されました。ジェネリクスやenumも同じ版で加わっています。
    sources:
      - title: New Features and Enhancements J2SE 5.0（Oracle）
        url: https://docs.oracle.com/javase/1.5.0/docs/relnotes/features.html
        anchor: Generics Enhanced for Loop Autoboxing/Unboxing Typesafe Enums
    note: J2SE 5.0の新機能の一覧で確かめた。--releaseに7以前は指定できないので、機械では--release 8で通ることだけを確かめる
    verify:
      kind: since
      probe: Java5Features.java
      version: 5

  - id: java5-2004
    claim: Java 5（J2SE 5.0）は2004年に公開された
    text: 拡張for文は、2004年のJava 5で導入されました
    sources:
      - title: "JSR 176: J2SE 5.0 (Tiger) Release Contents"
        url: https://jcp.org/en/jsr/detail?id=176
        anchor: Final Release Download page 30 Sep, 2004
    verify:
      kind: manual
      checked: 2026-11-19
      note: JSR 176のFinal Releaseが2004年9月30日であることを確かめた

  - id: stringbuilder-5
    claim: StringBuilderはJava 5で加わった
    text: StringBuilderはJava 5で加わりました
    sources:
      - title: java.lang.StringBuilder（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuilder.html
        anchor: "Since: 1.5 See Also: StringBuffer"
    note: src.zipの@since（StringBuilderは1.5）とAPIドキュメントで確かめた。--releaseに7以前は指定できないので、機械では--release 8で通ることだけを確かめる
    verify:
      kind: since
      probe: StringBuilderProbe.java
      version: 5

  - id: unnamed-variable-22
    claim: Java 22から、使わない変数を単独の_で宣言できる（JEP 456）
    text: Java 22からは、使わない変数を表す記号として書ける
    sources:
      - title: JEP 456 Unnamed Variables & Patterns
        url: https://openjdk.org/jeps/456
        anchor: Unnamed Variables
    verify:
      kind: since
      probe: UnnamedVariable.java
      version: 22
      expect: ['unnamed variables|underscore|_']

  # ---- 版以外の主張（2026-11-24、Issue #034）
  - id: primitive-sizes
    claim: Javaのint・long・charなどの大きさは環境によらず決まっている（intは32ビット、範囲は約-21億〜21億、charは16ビット）
    text:
      - Javaのintは、どの環境でもつねに32ビットです
      - 扱える範囲はおよそ-21億〜21億で
      - 16ビットでUnicodeの文字を表す
    sources:
      - title: JLS 25 4.2.1 Integral Types and Values
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html
        anchor: For int, from -2147483648 to 2147483647, inclusive
    verify:
      kind: run
      probe: PrimitiveFacts.java
      expect:
        - '^int: 32 -2147483648 2147483647$'
        - '^long: 64 -9223372036854775808 9223372036854775807$'
        - '^char: 16$'

  - id: double-precision
    claim: doubleはIEEE 754の倍精度（64ビット）で、10進で約15桁の精度がある（往復を保証できるのは15桁、区別に要るのは17桁）
    text:
      - 精度は約15桁あり
      - IEEE 754の単精度（32ビット）と倍精度（64ビット）の形式です
    sources:
      - title: JLS 25 4.2.3 Floating-Point Types and Values
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html
        anchor: binary64
    verify:
      kind: run
      probe: PrimitiveFacts.java
      expect:
        - '^double: 64 1\.7976931348623157E308$'
        - '^float: 32 3\.4028235E38$'
      note: 「約15桁」は、10進の15桁の値をdoubleにして戻すと元に戻るという意味での精度（C言語のDBL_DIG=15と同じ）

  - id: default-values
    claim: フィールドと配列の要素は型ごとのデフォルト値（0、0.0、false、'\u0000'、null）で初期化される
    text: フィールドと配列の要素は、型ごとのデフォルト値で自動的に初期化される
    sources:
      - title: JLS 25 4.12.5 Initial Values of Variables
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html
        anchor: Each class variable, instance variable, or array component is initialized with a default value
    verify:
      kind: run
      probe: PrimitiveFacts.java
      expect:
        - '^fields: 0 0\.0 false 0$'
        - '^arrays: 0 null$'

  - id: string-literal-identity
    claim: 同じ内容の文字列リテラルは1つのオブジェクトを共有するので==がtrueになるが、new Stringや実行中に組み立てた文字列ではfalseになる
    text: これは同じ内容のリテラルが1つのオブジェクトを共有するためで、入力から読み取った文字列や実行中に組み立てた文字列では成り立ちません
    sources:
      - title: JLS 25 3.10.5 String Literals
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-3.html
        anchor: a string literal always refers to the same instance of class String
    verify:
      kind: run
      probe: PrimitiveFacts.java
      expect:
        - '^literal==literal: true$'
        - '^literal==new: false$'
        - '^literal==built: false$'

  - id: concat-single-expression
    claim: 1つの式のなかで+をつないだ連結は、コンパイラーが1回の処理（invokedynamicのmakeConcatWithConstants）に変換する
    text: 1つの式のなかで+をつないだ連結は、コンパイラーがまとめて1回の処理に変換します
    sources:
      - title: "JEP 280: Indify String Concatenation"
        url: https://openjdk.org/jeps/280
    verify:
      kind: javap
      probe: ConcatInExpression.java
      class: ConcatInExpression
      expect: ['invokedynamic.*makeConcatWithConstants']

  - id: byte-arithmetic-int
    claim: byteどうしの計算の結果はintになり、byteの変数に代入するとコンパイルエラーになる
    text: そのため、byte b = 10;のあとにb = b + 1;と書くと、intの結果をbyteへ代入する縮小変換になり、コンパイルエラーになります
    sources:
      - title: JLS 25 5.6 Numeric Contexts
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html
        anchor: widening primitive conversion
    verify:
      kind: javac
      probe: compile-errors/ByteArithmetic.java
      fails: true
      expect: ['possible lossy conversion from int to byte']

  - id: byte-compound-assignment
    claim: +=などの複合代入演算子は、結果を左辺の型へ自動で縮小変換する
    text: +=のような代入の演算子は、結果を左辺の型へ自動で変換します
    sources:
      - title: JLS 25 15.26.2 Compound Assignment Operators
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html
        anchor: is equivalent to E1 = (T) ((E1) op (E2))
    verify:
      kind: run
      probe: ByteCompound.java
      expect:
        - '^b \+= 1: -128$'
        - '^cast: 11$'
