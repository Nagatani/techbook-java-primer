# 第23章の主張と、その確かめ方（node scripts/check-claims.js ch23）
jdk: 25
claims:
  - id: no-standalone-jre-11
    claim: OracleはJDK 11からJRE（とServer JRE）を単独では提供せず、jlinkで小さなランタイムを作る方法を示した
    text: OracleはJava 11からJREを単独では配布しておらず、アプリケーションに必要なモジュールだけを含むランタイムをjlinkで作る方法を勧めています
    sources:
      - title: JDK 11 Release Notes（Oracle）
        url: https://www.oracle.com/java/technologies/javase/11-relnote-issues.html
        anchor: In this release, the JRE or Server JRE is no longer offered. Only the JDK is offered. Users can use jlink to create smaller custom runtimes.
    verify:
      kind: manual
      checked: 2026-11-19
      note: OracleのJDK 11のリリースノートの記述を確かめた

  - id: jpackage-14-16
    claim: jpackageはJava 14でincubatorとして加わり（JEP 343）、Java 15でもincubatorのままで、Java 16（JEP 392）で正式な機能になった
    text:
      - Java 16で正式に導入されたjpackageツール
      - jpackageはJava 14で試験的な機能（インキュベーター）として加わり、Java 16（JEP 392）で正式な機能になりました
    sources:
      - title: "JEP 343: Packaging Tool (Incubator)"
        url: https://openjdk.org/jeps/343
        anchor: Release 14
      - title: "JEP 392: Packaging Tool"
        url: https://openjdk.org/jeps/392
        anchor: The jpackage tool was introduced as an incubating tool in JDK 14 by JEP 343 . It remained an incubating tool in JDK 15
    verify:
      kind: manual
      checked: 2026-11-19
      note: JEP 343（Release 14、jdk.incubator.jpackageモジュール）とJEP 392（Release 16）の記述を確かめた。JEP 392は、jpackageがjlinkでランタイムを作ることも述べている

  # ---- コラム「「自分のPCでは動くのに」をなくす工夫」（2026-11-19）
  - id: column-class-file-versions
    claim: Java 25のクラスファイルの版は69、Java 21は65。JVMは自分の版より新しいクラスファイルを読むとUnsupportedClassVersionError（has been compiled by a more recent version of the Java Runtime (class file version N), this version of the Java Runtime only recognizes class file versions up to M）を投げる
    text:
      - Java 25でコンパイルしたクラスファイルの版は69で、Java 21のJVMが読めるのは版65までです
      - 古いJVMで動かすと、UnsupportedClassVersionErrorになり
    verify:
      kind: run
      probe: NewerClassFile.java
      expect:
        - '^Java 21のクラスファイルの版: 65$'
        - '^Java 25のクラスファイルの版: 69$'
        - 'UnsupportedClassVersionError: Hello has been compiled by a more recent version of the Java Runtime \(class file version 70\.0\), this version of the Java Runtime only recognizes class file versions up to 69\.0'
  - id: column-line-separator
    claim: System.lineSeparator()は、UNIXでは"\n"、Windowsでは"\r\n"を返す
    text: 'System.lineSeparator()はUNIXでは\n、Windowsでは\r\n'
    sources:
      - title: java.lang.System#lineSeparator（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/System.html
        anchor: 'On UNIX systems, it returns "\n"; on Microsoft Windows systems it returns "\r\n".'
    verify:
      kind: manual
      checked: 2026-11-19
      note: lineSeparatorの説明を読んだ。メッセージの文面は日本語に意訳して本文に載せた（Java 21の実物ではなく、版を70に書き換えたクラスファイルをJava 25で動かして形を確かめた）
