# 第13章の主張と、その確かめ方（node scripts/check-claims.js ch13）
jdk: 25
claims:
  - id: helpful-npe-14
    claim: nullだった式を示すNullPointerExceptionの詳しいメッセージはJava 14で加わった（JEP 358。当初は既定で無効）
    text: nullだった式を示す詳しいメッセージはJava 14で加わり
    sources:
      - title: JEP 358 Helpful NullPointerExceptions
        url: https://openjdk.org/jeps/358
        anchor: Release 14
    verify:
      kind: manual
      checked: 2026-11-19
      note: JEP 358がRelease 14で、オプション-XX:ShowCodeDetailsInExceptionMessagesは最初は既定でfalseとあることを確かめた

  - id: helpful-npe-default-15
    claim: 詳しいメッセージはJava 15から既定で表示される
    text: Java 15から既定で表示されます
    sources:
      - title: JDK 15 Release Notes（Oracle）
        url: https://www.oracle.com/java/technologies/javase/15-relnote-issues.html
        anchor: Enable ShowCodeDetailsInExceptionMessages by default
    verify:
      kind: manual
      checked: 2026-11-19
      note: JDK 15のリリースノートに、ShowCodeDetailsInExceptionMessagesの既定がtrueに変わった旨（JDK-8233014）があることを確かめた。JDK 25の既定値はhelpful-npe-flagで確かめる

  - id: helpful-npe-flag
    claim: JDK 25ではShowCodeDetailsInExceptionMessagesの既定値がtrue
    text: Java 15から既定で表示されます
    verify:
      kind: flag
      flag: ShowCodeDetailsInExceptionMessages
      value: true

  - id: helpful-npe-local1
    claim: ローカル変数の名前がクラスファイルにないとき、メッセージの変数名は<local1>のようになる
    text: となるのは、クラスファイルにローカル変数の名前が残っていないためで
    verify:
      kind: run
      probe: HelpfulNpe.java
      expect: ['because "<local1>" is null']

  - id: helpful-npe-g
    claim: javac -gでコンパイルすると、メッセージに変数名strが出る
    text: javac -gでコンパイルするとstrと表示されます
    verify:
      kind: run
      probe: HelpfulNpe.java
      javac: ['-g']
      expect: ['because "str" is null']

  - id: try-with-resources-7
    claim: try-with-resources文はJava 7で導入された
    text: そこでJava 7で導入されたのがtry-with-resources文です
    sources:
      - title: Java Programming Language Enhancements（Java SE 7、Oracle）
        url: https://docs.oracle.com/javase/7/docs/technotes/guides/language/enhancements.html
        anchor: The try-with-resources Statement
    verify:
      kind: manual
      checked: 2026-11-19
      note: 「Enhancements in Java SE 7」にtry-with-resources文があること、src.zipの@since（AutoCloseableは1.7）で確かめた。--release 8で通ることはtry-compile-8で確かめる

  - id: try-compile-8
    claim: try-with-resources文とjava.util.loggingはJava 8より前からある（--release 8で通る）
    text: そこでJava 7で導入されたのがtry-with-resources文です
    verify:
      kind: since
      probe: TryWithResources.java
      version: 8

  - id: logging-1-4
    claim: java.util.loggingパッケージはJava 1.4で標準ライブラリに加わった
    text: Java 1.4で標準ライブラリに加わったjava.util.loggingパッケージのクラスです
    sources:
      - title: java.util.logging.Logger（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.logging/java/util/logging/Logger.html
        anchor: "1.4"
    verify:
      kind: manual
      checked: 2026-11-19
      note: src.zipの@since（Loggerは1.4）で確かめた

  # ---- コラム「スタックトレースを読める人は強い」（2026-11-19）
  - id: column-stacktrace-output
    claim: 原因を渡して包んだ例外のスタックトレースは、包んだ例外の行のあとに「Caused by:」と原因の例外を表示し、共通する下の部分を「... 2 more」と省く（コラムに載せた出力は、このプローブの実際の出力。JDKの行番号は版で変わる）
    text:
      - '設定のポート番号に80aと書かれていたときに出る例です'
    verify:
      kind: run
      probe: ConfigLoader.java
      expect:
        - '^Exception in thread "main" java.lang.IllegalStateException: 設定のポート番号が数字ではありません$'
        - '^\tat ConfigLoader.readPort\(ConfigLoader.java:7\)$'
        - '^\tat ConfigLoader.start\(ConfigLoader.java:12\)$'
        - '^\tat ConfigLoader.main\(ConfigLoader.java:17\)$'
        - '^Caused by: java.lang.NumberFormatException: For input string: "80a"$'
        - '^\tat java.base/java.lang.Integer.parseInt\(Integer.java:\d+\)$'
        - '^\tat ConfigLoader.readPort\(ConfigLoader.java:5\)$'
        - '^\t\.\.\. 2 more$'

  - id: column-stacktrace-more
    claim: スタックトレースの「... n more」は、その例外の残りの履歴が、包んだ側（enclosing）の例外の履歴の下のn行と同じであることを表す
    text: '最後の... 2 moreは、残りの呼び出しの履歴が、包んだほうの例外の履歴の下の2行と同じなので省いた、という意味です'
    sources:
      - title: java.lang.Throwable#printStackTrace（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Throwable.html
        anchor: matches the indicated number of frames from the bottom of the stack trace of the exception that was caused by this exception
    verify:
      kind: manual
      checked: 2026-11-19
      note: printStackTraceの説明の「Note the presence of lines containing the characters "..."」の段落を読んだ

  # ---- 版以外の主張（2026-11-24、Issue #034）
  - id: finally-always
    claim: finallyブロックは例外の有無にかかわらず実行されるが、tryのなかでSystem.exitを呼んだときは実行されない
    text:
      - tryブロック内で例外が発生したかどうかにかかわらず、必ず実行される処理を記述します
      - tryブロックのなかでSystem.exitを呼んだときやJVMが強制的に止められたときは実行されません
    simplified: true
    note: 「必ず実行される」は、System.exitやJVMの強制終了を除いた説明。脚注でその旨を書いた（2026-11-24）
    sources:
      - title: JLS 25 14.20.2 Execution of try-finally and try-catch-finally
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html
    verify:
      kind: run
      probe: FinallyExit.java
      args: [exit]
      expect: ['^try$']
      absent: ['^finally$']

  - id: catch-order
    claim: 親クラスの例外を先にcatchすると、後ろのサブクラスのcatchに届かずコンパイルエラーになる
    text: 親クラスの例外（Exceptionなど）を先に書くと、後ろにあるサブクラスのcatchには処理が届かないため、コンパイルエラーになります
    verify:
      kind: javac
      probe: compile-errors/CatchOrder.java
      fails: true
      expect: ['exception FileNotFoundException has already been caught']

  - id: multi-catch-7
    claim: マルチキャッチはJava 7から使える
    text: のように、例外の型を|で区切って1つのcatchにまとめられます（マルチキャッチ、Java 7以降）
    sources:
      - title: Java SE 7 Features and Enhancements（Catching Multiple Exception Types）
        url: https://www.oracle.com/java/technologies/javase/jdk7-relnotes.html
    verify:
      kind: run
      probe: ExceptionFacts.java
      expect: ['^multi-catch: io$']
      note: Java 7より前の版はJDK 25のjavacの--releaseで指定できない（8が最小）ので、Java 7での導入はリリースノートで確かめた

  - id: checked-must-handle
    claim: 検査例外をtry-catchもthrowsもせずに投げうるメソッドを呼ぶとコンパイルエラーになる
    text: どちらも書かずに検査例外を発生させうるメソッドを呼ぶと、コンパイルエラーになります
    sources:
      - title: JLS 25 11.2 Compile-Time Checking of Exceptions
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-11.html
    verify:
      kind: javac
      probe: compile-errors/UnreportedChecked.java
      fails: true
      expect: ['unreported exception FileNotFoundException; must be caught or declared to be thrown']

  - id: override-throws-broader
    claim: オーバーライドするメソッドのthrowsに親より広い検査例外を書くとコンパイルエラーになる
    text: throws Exceptionのように、より広い検査例外を書くとコンパイルエラーになります
    sources:
      - title: JLS 25 8.4.8.3 Requirements in Overriding and Hiding
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
    verify:
      kind: javac
      probe: compile-errors/OverrideBroader.java
      fails: true
      expect: ['load\(\) in Child cannot override load\(\) in Parent']

  - id: override-throws-narrower
    claim: オーバーライドするメソッドは、親の検査例外のサブクラスと、任意の非検査例外をthrowsに書ける
    text:
      - throwsに書けるのは、親クラスのメソッドが宣言した検査例外か、その子クラスの例外だけです
      - 非検査例外には、この制約はありません
    verify:
      kind: run
      probe: ExceptionFacts.java
      expect: ['^body$']

  - id: lambda-checked
    claim: 検査例外を投げるメソッドをラムダ式のなかで呼ぶとコンパイルエラーになり、日本語のjavacは「例外IOExceptionは報告されません。スローするには、捕捉または宣言する必要があります」と報告する
    text:
      - 検査例外を投げるメソッドをラムダ式のなかで呼ぶと、その例外をラムダ式の外へ投げられず、コンパイルエラーになります
      - 例外IOExceptionは報告されません。スローするには、捕捉または宣言する必要があります
    verify:
      kind: javac
      probe: compile-errors/LambdaChecked.java
      fails: true
      expect: ['unreported exception IOException; must be caught or declared to be thrown']
      note: 日本語の表示は-J-Duser.language=jaで実行して確かめた（2026-11-24）

  - id: twr-close-order-suppressed
    claim: try-with-resourcesは宣言と逆の順にリソースを閉じ、tryの例外を投げてcloseの例外を抑制された例外として付け加える。finallyで閉じる書き方ではcloseの例外が元の例外を上書きする
    text:
      - このときtry-with-resourcesは、tryブロックで発生した例外を呼び出し元へ投げ、closeの例外はその例外に「抑制された例外（suppressed exception）」として付け加えます
      - finallyブロックで閉じる書き方では、closeの例外が元の例外を上書きし、本当の原因がわからなくなることがあります
    sources:
      - title: JLS 25 14.20.3 try-with-resources
        url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html
        anchor: closed in the reverse order from that in which they were initialized
    verify:
      kind: run
      probe: ExceptionFacts.java
      expect:
        - '^close B\nclose A$'
        - '^thrown: original, suppressed: close failed: C$'
        - '^finally style thrown: close failed: D$'
