# 第6章の主張と、その確かめ方（node scripts/check-claims.js ch06）
jdk: 25
claims:
  - id: record-16
    claim: レコードはJava 16から使える
    text: Java 16以降では、Record（レコード）という書き方で、不変なクラスを短く書けます
    verify:
      kind: since
      probe: RecordProbe.java
      version: 16
      expect: ['records are not supported in -source 15']

  - id: list-copyof-10
    claim: List.copyOfはJava 10で加わった
    text: List.copyOfはJava 10で加わったメソッドです
    verify:
      kind: since
      probe: ListCopyOf.java
      version: 10
      expect: ['cannot find symbol']

  - id: java-time-8
    claim: java.timeパッケージはJava 8で加わった
    text: その代表が、Java 8で加わった、日付と時刻を扱うjava.timeパッケージのクラスです
    sources:
      - title: "JEP 150: Date & Time API"
        url: https://openjdk.org/jeps/150
        anchor: Release 8
    verify:
      kind: since
      probe: JavaTime.java
      version: 8

  - id: date-calendar-before-8
    claim: Java 8より前は、日付と時刻をjava.util.Dateとjava.util.Calendarで扱っていた
    text: Java 8より前は、日付と時刻をjava.util.Dateとjava.util.Calendarで扱っていました
    sources:
      - title: java.util.Date（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Date.html
        anchor: "Since: 1.0"
      - title: java.util.Calendar（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Calendar.html
        anchor: "Since: 1.1"
    note: src.zipの@since（Dateは1.0、Calendarは1.1）で確かめた。--releaseに7以前は指定できないので、機械では--release 8で通ることだけを確かめる
    verify:
      kind: since
      probe: DateCalendar.java
      version: 1

  # ---- コラム「お金の計算は「型」より「決まりごと」が難しい」（2026-11-19）
  - id: column-tax-rounding-where
    claim: 98円を3つ、税率10%・1円未満切り捨てで計算すると、品目ごとに切り捨てて足せば27円、合計294円に掛けてから切り捨てれば29円になる
    text:
      - 品目ごとに税を計算して切り捨ててから足すと、9円が3つで27円です
      - 3つを合計した294円に税を掛けてから切り捨てると、29円になります
    verify:
      kind: run
      probe: TaxRounding.java
      expect: ['^品目ごとに切り捨て: 27円$', '^合計してから切り捨て: 29円$']

  # ---- コラム「タイムゾーンと「2038年問題」」（2026-11-19）
  - id: column-2038-overflow
    claim: 1970-01-01T00:00:00Zからの秒数を符号付き32ビットで表せる最後の時刻は2038-01-19T03:14:07Zで、1秒後をintに入れると1901-12-13T20:45:52Zになる
    text:
      - 表せる最後の時刻は2038年1月19日3時14分7秒（UTC）です
      - 時刻は1901年12月13日に戻ってしまいます
    verify:
      kind: run
      probe: Year2038.java
      expect: ['^intの最大の秒数: 2038-01-19T03:14:07Z$', '^1秒後をintに入れると: 1901-12-13T20:45:52Z$']

  - id: column-instant-range
    claim: Instantは秒数を64ビット（long）で持ち、最大はおよそ10億年（+1000000000-12-31T23:59:59.999999999Z）である
    text: Javaの`Instant`は秒数を64ビットで持つので、10億年先まで表せます
    sources:
      - title: java.time.Instant（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/Instant.html
        anchor: The range of an instant requires the storage of a number larger than a long
    verify:
      kind: run
      probe: Year2038.java
      expect: ['^Instantの最大: \+1000000000-12-31T23:59:59.999999999Z$']

  - id: column-timezone-display
    claim: 2026-01-01T00:00Z は、東京（Asia/Tokyo）では2026-01-01T09:00、ニューヨーク（America/New_York）では2025-12-31T19:00である
    text: 2026年1月1日0時（UTC）は、東京では1月1日9時、ニューヨークでは前の年の12月31日19時です
    verify:
      kind: run
      probe: Year2038.java
      expect: ['^東京: 2026-01-01T09:00$', '^ニューヨーク: 2025-12-31T19:00$']

  - id: column-dst-gap
    claim: ニューヨークでは2026-03-08の2時台が夏時間の始まりで飛ばされ、2:30を指定するとZonedDateTimeは3:30に読み替える
    text: ニューヨークでは2026年3月8日の2時台が飛ばされるので、2時30分を指定すると3時30分に読み替えられます
    sources:
      - title: java.time.ZonedDateTime（Java SE 25 API）の Gap の説明
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/ZonedDateTime.html
        anchor: the local date-time is adjusted to be later by the length of the gap
    verify:
      kind: run
      probe: Year2038.java
      expect: ['^2026-03-08T02:30 をニューヨークの時刻にすると: 2026-03-08T03:30$']

  # ---- 版以外の主張（2026-11-24、Issue #034）
  - id: string-final
    claim: Stringクラスはfinalと宣言されている
    text: public final class Stringと宣言されている
    sources:
      - title: String（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html
        anchor: public final class String
    verify:
      kind: run
      probe: ImmutabilityFacts.java
      expect: ['^String is final: true$']

  - id: final-not-for-speed
    claim: いまのJVMは、オーバーライドするサブクラスが読み込まれていなければ、finalのないメソッドの呼び出しもインライン化する（クラス階層解析）。サブクラスが読み込まれると脱最適化する
    text: いまのJVMは、実行中にサブクラスが読み込まれていなければ、finalのないクラスでも同じようにメソッド呼び出しを最適化します
    verify:
      kind: run
      probe: ../../../appendix/b04-virtual-method-table/verify/ClassHierarchy.java
      jvm: ['-XX:+PrintCompilation']
      expect:
        - '--- サブクラスを読み込む ---[\s\S]*ClassHierarchy::sum .*made not entrant: marked for deoptimization'
      attempts: 3
      note: 付録B.04のcha-deoptと同じ観察

  - id: smart-resolver-month-end
    claim: DateTimeFormatter.ofPatternの既定の読み取り（SMART）は、2月30日を月末（2月28日）に丸める。STRICTでは例外になる
    text:
      - 読み取りの既定の方法（SMART）は、2月30日のような存在しない日を月末に丸めてしまいます
      - 書式に合わない文字列はDateTimeParseExceptionになります
    sources:
      - title: ResolverStyle.SMART（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/format/ResolverStyle.html
    verify:
      kind: run
      probe: ImmutabilityFacts.java
      expect:
        - '^SMART 2026-02-30 -> 2026-02-28$'
        - '^STRICT 2026-02-30 -> DateTimeParseException$'

  - id: strict-yyyy-needs-era
    claim: STRICTではyyyyが紀元のなかの年を表すので、Gのない書式では読み取れない
    text: STRICTではyyyyが「紀元のなかの年」を表すので、紀元を表すGがない書式では読み取れません
    sources:
      - title: DateTimeFormatter（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/format/DateTimeFormatter.html
        anchor: year-of-era
    verify:
      kind: run
      probe: ImmutabilityFacts.java
      expect: ['^STRICT yyyy 2026-02-28 -> DateTimeParseException$']

  - id: unmodifiable-view-vs-copy
    claim: Collections.unmodifiableListは元のリストのビューで元の変更が見える。List.copyOfはコピーで影響を受けず、nullを含むとNullPointerExceptionになる
    text:
      - Collections.unmodifiableList(リスト)は、元のリストを包んだ読み取り専用のビューを返します
      - 要素にnullを含むリストを渡すと、例外（NullPointerException）が発生します
    sources:
      - title: List.copyOf（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html
        anchor: NullPointerException - if coll is null, or if it contains any nulls
    verify:
      kind: run
      probe: ImmutabilityFacts.java
      expect:
        - '^view: \[a, b\] copy: \[a\]$'
        - '^List.copyOf with null -> NullPointerException$'

  - id: bigdecimal-slower
    claim: BigDecimalの計算はlongの計算より時間がかかる（一般的な傾向。観察では足し算で3倍を超えた）
    text: BigDecimalとBigIntegerは、基本型の計算よりも時間がかかり、メモリも多く使います
    verify:
      kind: run
      probe: ImmutabilityFacts.java
      expect: ['^BigDecimal slower than long in 5 rounds: [1-5]$']
      attempts: 3

  - id: biginteger-range
    claim: BigIntegerの仕様が求める範囲は-2^Integer.MAX_VALUEから+2^Integer.MAX_VALUE（どちらも含まない）
    text: 仕様では、およそ±2の21億乗の範囲の値を扱えることになっています
    sources:
      - title: BigInteger（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/math/BigInteger.html
        anchor: BigInteger must support values in the range
    verify:
      kind: manual
      checked: 2026-11-24
      note: APIドキュメントの冒頭の「BigInteger must support values in the range -2^Integer.MAX_VALUE (exclusive) to +2^Integer.MAX_VALUE (exclusive)」で確かめた
