# 第24章の主張と、その確かめ方（node scripts/check-claims.js ch24）
jdk: 25
claims:
  - id: jdbc40-driver-discovery
    claim: JDBC 4.0（Java 6）から、ドライバーはServiceLoaderの仕組み（META-INF/services/java.sql.Driver）で自動で読み込まれ、Class.forNameは要らなくなった
    text: JDBC 4.0（Java 6）から、ドライバーのJARのMETA-INF/services/java.sql.Driverに書かれたクラスが自動で読み込まれるようになりました
    sources:
      - title: java.sql（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/package-summary.html
        anchor: auto java.sql.Driver discovery -- no longer need to load a java.sql.Driver class via Class.forName
      - title: java.sql（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/package-summary.html
        anchor: Since 1.6 -- new in the JDBC 4.0 API and part of the Java SE platform, version 6
      - title: DriverManager（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/DriverManager.html
        anchor: loaded via the service-provider loading mechanism
    verify:
      kind: manual
      checked: 2026-11-19
      note: java.sqlのパッケージの説明の「Features Introduced in the JDBC 4.0 API」と、JDBC 4.0がJava SE 6の一部である旨、DriverManagerの説明を確かめた

  - id: jdbc42-java-time
    claim: JDBC 4.2（Java 8）で、java.timeの型（LocalDate・LocalTime・LocalDateTimeなど）がsetObjectやgetObjectで扱える型に加わった
    text: JDBC 4.2（Java 8）から使えます
    sources:
      - title: java.sql（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/package-summary.html
        anchor: Since 1.8 -- new in the JDBC 4.2 API and part of the Java SE platform, version 8
      - title: JDBC 4.2 Maintenance Release（JSR 221, January 2014, PDF）
        url: https://www.jcp.org/aboutJava/communityprocess/maintenance/jsr221/JDBC4.2MR-January2014.pdf
    verify:
      kind: manual
      checked: 2026-11-19
      note: JDBC 4.2のMRの21〜22項に「Map the Java Object Type java.time.LocalDate to the JDBC Type DATE」などの表B-4への追加と、表B-5（setObjectの変換）への追加がある（PDFのストリームを展開して文字を確かめた）。JDBC 4.2がJava SE 8の一部であることはjava.sqlのパッケージの説明で確かめた

  # ---- コラム「SQLインジェクションはなぜなくならないのか」（2026-11-19）
  - id: column-owasp-injection-2025
    claim: OWASP Top 10:2025で、インジェクションは5位（A05:2025）で、2021年版の3位から2つ下がった。OWASPは、アプリケーションの100%が何らかのインジェクションについて検査されたとしている
    text:
      - インジェクションは5位に入っています（2021年版の3位から2つ下がりました）
      - 調べたアプリケーションのすべてが、何らかのインジェクションについて検査されていました
    sources:
      - title: OWASP Top 10:2025 A05 Injection
        url: https://owasp.org/Top10/2025/A05_2025-Injection/
        anchor: Injection falls two spots from #3 to #5 in the ranking
      - title: OWASP Top 10:2025 A05 Injection
        url: https://owasp.org/Top10/2025/A05_2025-Injection/
        anchor: 100% of applications tested for some
    verify:
      kind: manual
      checked: 2026-11-19
      note: 一覧（https://owasp.org/Top10/2025/）でA05:2025がInjectionであることと、A05のBackgroundの文を読んだ

  - id: column-placeholder-values-only
    claim: PreparedStatementの?には値しか渡せない。H2 2.5.252では「SELECT * FROM ?」は準備の段階でSQLExceptionになり、「ORDER BY ?」に列の名前を渡してもSQLExceptionになる。許した列名の一覧から選んだ名前をSQL文に入れれば並べ替えられる
    text:
      - SELECT * FROM ?は準備の段階でSQLExceptionになり、ORDER BY ?に列の名前を渡しても、列の名前としては扱われません
      - 表の名前や列の名前は?にできません
    verify:
      kind: run
      probe: PlaceholderLimits.java
      libs: ['com.h2database:h2:2.5.252']
      expect: ['^表の名前を\?にする: SQLException$', '^ORDER BY \?に列の名前を渡す: SQLException$', '^許した列名で並べる（price）: \[A, B, C\]$']

  # ---- 節「バッチ処理」の測定（2026-11-24）
  - id: batch-timing-embedded-vs-tcp
    claim: H2 2.5.252を組み込みで使うと、3650件の追加で1件ずつ送る形とバッチの差は数ミリ秒にとどまる。同じH2をTCPサーバーとして起動して接続すると、1件ずつ送る形はバッチの10倍以上の時間がかかる（Apple M3・JDK 25で、1件ずつ54〜71ミリ秒、バッチ4〜5ミリ秒）
    text:
      - 3650件を追加する時間の差は、1件ずつ送る形とバッチで数ミリ秒でした
      - 1件ずつ送る形は60ミリ秒前後、バッチは約5ミリ秒で、10倍以上の差が出ました
    verify:
      kind: run
      probe: BatchTiming.java
      libs: ['com.h2database:h2:2.5.252']
      expect: ['^組み込み: 差は10ミリ秒未満: true$', '^ネットワーク経由: バッチは1件ずつの3分の1未満: true$']
