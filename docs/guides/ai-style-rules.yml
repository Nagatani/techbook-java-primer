# AIが書いた文章らしさの検出ルール（npm run check:style が読む）
#
# どれも「使ってはいけない」ではなく「見直す候補」として示すもの。
# 文脈上ふさわしい箇所は直さなくてよい。直さないと決めた箇所は
# exceptions に、ファイル名と本文の一部（text）を書いて対象から外す。
#
# words: 文の中に現れたら注意する語
#   pattern  正規表現
#   kind     分類（抽象語・定型句・冒頭・締め・誇張・語り口）
#   hint     どう見直すか

words:
  - pattern: "柔軟(な|に|性)"
    kind: 抽象語
    hint: 何をどう変えられるのかを具体的に書く（例「実装クラスを差し替えても呼び出し側を変えずに済む」）
  - pattern: "強力な"
    kind: 抽象語
    hint: 何ができるのかを書く。言えなければ削る
  - pattern: "堅牢"
    kind: 抽象語
    hint: どんな誤りを防ぐのかを書く
  - pattern: "効率的(な|に)"
    kind: 抽象語
    hint: 何が速く／少なく済むのかを書く
  - pattern: "直感的(な|に)"
    kind: 抽象語
    hint: 誰にとって、何と比べてわかりやすいのかを書く
  - pattern: "シームレス"
    kind: 抽象語
    hint: 具体的なつながり方を書く
  - pattern: "現代的(な|に)"
    kind: 抽象語
    hint: 「Java 7で加わった」のように時期や比べる相手を書く
  - pattern: "さまざまな"
    kind: 抽象語
    hint: 例を1〜2個挙げるか削る
  - pattern: "重要な役割を(果たし|担い)"
    kind: 定型句
    hint: どんな役割かを動詞で書く
  - pattern: "(不可欠|欠かせない)"
    kind: 誇張
    hint: なければ何が困るのかを書く
  - pattern: "非常に"
    kind: 誇張
    hint: 削るか、数値や比較で示す
  - pattern: "を通じて"
    kind: 定型句
    hint: 「〜で」「〜を使って」で足りないか見る
  - pattern: "することで"
    kind: 定型句
    hint: 「〜すると」「〜すれば」の方が自然でないか見る。1段落に2回以上あれば言い換える
  - pattern: "が可能(になります|です)"
    kind: 定型句
    hint: 「〜できます」にする
  - pattern: "を実現(します|できます)"
    kind: 定型句
    hint: 何をするのかを動詞で書く
  - pattern: "理解を深め"
    kind: 定型句
    hint: 読者が何をできるようになるかを書く
  - pattern: "しましょう"
    kind: 語り口
    hint: 本書の語り口として残すか、「〜します」にするかを決める
  - pattern: "と言える(でしょう)?|といえる(でしょう)?"
    kind: 語り口
    hint: 言い切るか、根拠を添える

# sentences: 文全体の形で見るもの（1文ごとに当てる）
sentences:
  - id: opening-declaration
    pattern: "^(ここでは|この節では|本節では|この章では|本章では).{0,40}(説明|紹介|解説|見て|学び|学習|扱い|確認)(します|いきます|ましょう)。$"
    kind: 冒頭
    hint: 宣言を消して、具体的な問題・コード・場面から書き始める
  - id: generic-closing
    pattern: "(ことで|により|によって|すれば|すると).{0,40}(できるようになります|につながります|向上します|高まります|になります|が得られます)。$"
    kind: 締め
    hint: 段落の最後なら削っても意味が変わらないか確かめる。残すなら何がどうなるかを具体的に
  - id: generic-importance
    pattern: "(ことが|のが)(重要|大切|大事)です。$"
    kind: 締め
    hint: なぜ重要かを書くか、命令ではなく理由で示す
  - id: both-have-merits
    pattern: "(それぞれ|どちらも|いずれも).{0,20}(利点|長所|メリット|特徴|一長一短)"
    kind: 判断
    hint: 本書としてどちらを勧めるか、どんな場面でどちらを選ぶかを書く
  - id: vague-choice
    pattern: "((用途|目的|状況|場面|要件)に応じて|ケースバイケース).{0,20}使い分け|使い分け(ることが|が)(重要|大切)"
    kind: 判断
    hint: どの場面でどれを選ぶかを具体的に書く。本書の既定の選択があれば言い切る
  - id: hearsay
    pattern: "現場では|現場の(エンジニア|開発者)|よく口にされ|と(言|い)われています"
    kind: 伝聞
    hint: 著者の体験や講義での実例に置き換えられないか見る（docs/analysis/author-voice-points.md）
  - id: next-chapter
    pattern: "^(次章|次の章)では.{0,60}(学習|学び|扱い|見て)(します|ます)。$"
    kind: まとめ
    hint: 予告で締めず、この章で残った疑問から次章へつなぐ
  - id: triplet
    pattern: "[^、。]{2,12}(で|く|し)、[^、。]{2,12}(で|く|し)、[^、。]{2,14}(な|い)[^、。]{0,6}(コード|プログラム|設計|実装|システム)"
    kind: 三連
    hint: 形容を3つ並べている。2つで足りないか、1つに絞れないか見る

# 学習目標（「この章で学ぶこと」）のリストで、漢語の名詞止めを見る
objectives:
  pattern: "(理解|活用|習得|実装|把握|実践|使い分け|特性理解|基礎|概要|手法|方法)$"
  hint: 「〜を説明できる」「〜を選べる」のように、読者ができるようになることを動詞で書く

# 段落の指標（数値はそれ以上で注意）
paragraph:
  same-ending-run: 3          # 同じ文末（〜します／〜できます など）が続く回数
  min-sentences-for-cv: 4     # 文の長さのばらつきを見るのに要る文の数
  max-length-cv: 0.18         # 文の長さの変動係数がこれ以下なら単調とみなす
  max-teiku-per-paragraph: 2  # 「することで」など同じ定型句の1段落での回数

# 節の指標
section:
  max-list-ratio: 0.6         # 節の中で箇条書きの行が占める割合（本文の行に対して）
  min-lines: 10               # これより短い節は割合を見ない

# 直さないと決めた箇所
exceptions: []
#  - file: chapter05-inheritance.md
#    text: "柔軟な設計"
#    reason: 次の文で具体例を示している
