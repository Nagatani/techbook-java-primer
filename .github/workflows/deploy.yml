name: Deploy Vivliostyle to GitHub Pages

# mainブランチにプッシュされたときに実行する。本の中身にかかわるファイルを変えたときだけ
on:
  push:
    branches:
      - main
    paths:
      - 'manuscripts/**'
      - 'theme/**'
      - 'scripts/**'
      - 'docs/diagrams/**'
      - 'vivliostyle.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# ジョブがリポジトリをクローンし、デプロイを作成できるように権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 続けてpushしたら、待っている古い公開は取り消す（公開中のものは最後まで動かす）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ビルド処理
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # プロジェクトに合わせたNode.jsのバージョンを指定
          cache: 'npm'

      - name: Install dependencies
        run: npm ci  # lockファイルどおりに入れる（不一致ならここで止まる）

      - name: Build Vivliostyle book
        # package.jsonのbuildスクリプトを実行
        run: npm run build4web

      - name: Upload artifact
        # distフォルダの中身をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  # デプロイ処理
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # buildジョブの完了を待つ
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5