name: Check manuscript consistency

# pushとプルリクエストのたびに、構成・索引・サンプルコードの抜粋の食い違いを検査する（数分で終わる軽い検査だけ）。
# 手元のpre-commitフック（scripts/git-hooks/）を有効にし忘れた環境や、--no-verifyで省いたコミットも拾う。
# コンパイルは、コードを変えたときだけ動く code.yml で行う。
# 時間のかかる検査（実行結果の照合、JUnitのテスト、主張の検証、textlint）は手元で npm run check:local を流す。
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 同じブランチへ続けてpushしたら、古い検査を取り消す
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install dependencies
        run: npm ci

      - name: 章・演習・付録B・用語集・相互参照ガイドの検査
        run: npm run check:structure

      - name: 索引と要約が最新か
        run: npm run index:check

      # 本文のコードと全文（sample-code/）の範囲の一致、キャプション、番号。コンパイルはしない
      - name: サンプルコードの抜粋
        run: npm run check:samples -- --no-compile

      # 図の元データ（docs/diagrams/*.mmd）・画像・原稿の対応。文字が小さすぎる図は注意として表示するだけ
      - name: 図の元データと画像の対応
        run: npm run check:diagrams

      # 本文のインラインコードに書いたJDKのAPI名が、JDK 25に実在し、削除予定でないか
      - name: 本文のAPI名
        run: npm run check:api-names

      # 主張の台帳（付録Bのclaims.yml、本文のdocs/claims/）と解説・本文の対応、解説に書いたJVMフラグの実在
      - name: 主張の台帳と解説・本文の対応
        run: node scripts/check-claims.js --static
