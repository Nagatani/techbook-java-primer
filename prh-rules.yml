# 表記の統一（JIS Z 8301:2019 と内閣告示「外来語の表記」に従う）
# - 英語の語末の -er・-or・-ar に当たる外来語は、長音符号「ー」を付ける（2026-11-11〜）
# - 語末が -y の語（メモリ、ディレクトリ、ライブラリ、ファクトリなど）は長音符号を付けない
# 続けて -ing・-bility・-able の形になる語（フィルタリング、ユーザビリティ、リーダブル）は対象外
# textlint（npm run lint）の prh ルールとして使う。コードブロックとインラインコードは対象外
version: 1
rules:
