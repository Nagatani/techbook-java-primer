plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'  // 旧com.github.johnrengelman.shadowの後継（Gradle 9対応）
}

group = 'com.example.chapter22'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'  // Gradle 9以降は明示が必要
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Apache Commons Lang
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    
    // SLF4J + Logback
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
}

application {
    mainClass = 'chapter22.documentation.solutions.StudentManager'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Javadocタスクの設定
javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.author = true
    options.version = true
    options.use = true
    options.locale = 'ja_JP'
    options.windowTitle = "${project.name} ${project.version} API"
}

// 実行可能JARの作成
shadowJar {
    archiveBaseName.set('documentation-examples')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': 'chapter22.documentation.solutions.StudentManager'
    }
}

// カスタムタスク: すべての例を実行
// mainメソッドを持つクラスごとにJavaExecタスクを作り、runAllExamplesでまとめて実行する
['StudentManager', 'TextProcessor'].each { name ->
    tasks.register("run${name}", JavaExec) {
        group = 'examples'
        description = "${name}の例を実行します"
        mainClass = "chapter22.documentation.solutions.${name}"
        classpath = sourceSets.main.runtimeClasspath
    }
}

tasks.register('runAllExamples') {
    group = 'examples'
    description = 'すべての例を実行します'
    dependsOn 'runStudentManager', 'runTextProcessor'
}

// ソースJARの生成
task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    archiveClassifier.set('sources')
}

// JavadocJARの生成
task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier.set('javadoc')
}

// ビルド時にすべてのJARを生成（assembleタスクの依存に加える）
tasks.named('assemble') {
    dependsOn sourcesJar, javadocJar
}

// プロジェクト情報の表示
tasks.register('projectInfo') {
    // 実行時にprojectを参照しないよう、表示する値は設定時に取り出しておく
    def info = """
プロジェクト情報:
- グループ: ${project.group}
- 名前: ${project.name}
- バージョン: ${project.version}
- Javaバージョン: ${java.sourceCompatibility}

依存関係:
"""
    def dependencyList = configurations.implementation.dependencies.collect {
        "- ${it.group}:${it.name}:${it.version}"
    }
    doLast {
        println info
        dependencyList.each { println it }
    }
}
