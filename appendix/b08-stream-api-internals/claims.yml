        url: https://openjdk.org/jeps/485
        anchor: Stream Gatherers
      - title: 'JEP 461: Stream Gatherers (Preview)'
        url: https://openjdk.org/jeps/461
        anchor: Stream Gatherers (Preview)
      - title: 'JEP 473: Stream Gatherers (Second Preview)'
        url: https://openjdk.org/jeps/473
        anchor: Stream Gatherers (Second Preview)
    verify:
      kind: manual
      checked: 2026-11-19
      note: JEP 461・473・485の表のReleaseがそれぞれ22・23・24で、485の状態がClosed / Deliveredであることを確かめた

