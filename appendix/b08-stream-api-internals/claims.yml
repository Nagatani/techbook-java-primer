  - id: gatherers
    claim: Stream.gatherで、自作や標準（Gatherers）の中間操作をはさめる。windowFixedは決まった数ずつの組、windowSlidingはずらしながらの組、scanは途中経過、foldは1つの結果を出す。Gatherer.ofSequentialで状態を持つ中間操作を作れ、無限のストリームにも使える
    sources:
      - title: java.util.stream.Gatherers（Java SE 25 API）
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Gatherers.html
        anchor: Returns a Gatherer that gathers elements into windows
    verify:
      kind: run
      probe: verify/NewOperations.java
      expect:
        - '^windowFixed\(3\): +\[\[1, 2, 3\], \[4, 5, 6\], \[7\]\]$'
        - '^windowSliding\(3\): \[\[1, 2, 3\], \[2, 3, 4\], \[3, 4, 5\], \[4, 5, 6\], \[5, 6, 7\]\]$'
        - '^scan\(累計\): +\[1, 3, 6, 10, 15, 21, 28\]$'
        - '^fold\(合計\): +\[28\]$'
        - '^自作\(連続する重複を除く\): \[1, 2, 3, 1\]$'
        - '^無限のストリーム\+windowFixed\+limit: \[\[1, 2\], \[3, 4\], \[5, 6\]\]$'
      range: { from: 'Gatherers（Java 24' }
      show: ['^\S+[:：]? ']

  - id: gatherers-history
    claim: Stream Gatherersは、Java 22（JEP 461）と23（JEP 473）のプレビューを経て、Java 24（JEP 485）で正式な機能になった
    sources:
