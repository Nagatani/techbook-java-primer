plugins {
    id 'java'
    id 'application'
    // Fat JARを作るShadowプラグイン（旧com.github.johnrengelman.shadowの後継）
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Maven版（maven-project/pom.xml）と同じ版にそろえる
dependencies {
    // JSON処理
    implementation 'com.google.code.gson:gson:2.15.0'
    
    // ユーティリティ
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    
    // ロギング
    implementation 'ch.qos.logback:logback-classic:1.6.6'
    
    // テスト
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.example.TodoApp'
}

// エンコーディング設定
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// テスト設定
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// 通常のJARから使う依存ライブラリを build/libs/lib にコピーする
def copyLibs = tasks.register('copyLibs', Sync) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/lib')
}

// 通常のJAR設定（依存ライブラリはlib/から読み込む）
jar {
    def runtimeClasspath = configurations.runtimeClasspath
    manifest {
        attributes(
            'Main-Class': 'com.example.TodoApp',
            'Implementation-Title': 'Sample Todo Application',
            'Implementation-Version': version,
            'Class-Path': provider { runtimeClasspath.files.collect { "lib/$it.name" }.join(' ') }
        )
    }
    finalizedBy copyLibs
}

// Fat JAR設定（shadowプラグイン使用）
shadowJar {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.example.TodoApp'
    }
}

// カスタムFat JARタスク（プラグインを使わずに作る場合）
tasks.register('customFatJar', Jar) {
    archiveClassifier = 'custom-all'
    // 複数のライブラリに同じ名前のファイル（module-info.classやLICENSEなど）があるため、
    // 重複は最初の1つだけを入れる（指定しないとGradle 9ではビルドが失敗する）
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.example.TodoApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// 配布用タスク（Fat JARとREADMEを build/distribution にまとめる）
tasks.register('createDistribution', Sync) {
    from shadowJar
    from 'README.md'
    into layout.buildDirectory.dir('distribution')
}

// jpackageの入力（Fat JARだけを置き、出力先と分ける）
def jpackageInput = tasks.register('jpackageInput', Sync) {
    from shadowJar
    into layout.buildDirectory.dir('jpackage-input')
}

// jpackageタスク（build/jpackage-output/TodoApp を作る）
tasks.register('jpackage', Exec) {
    dependsOn jpackageInput

    def inputDir = layout.buildDirectory.dir('jpackage-input').get().asFile
    def outputDir = layout.buildDirectory.dir('jpackage-output').get().asFile
    def mainJar = tasks.named('shadowJar', Jar).flatMap { it.archiveFileName }.get()

    doFirst {
        // jpackageは出力先に同じ名前のアプリがあると失敗するため、前回の結果を消す
        new File(outputDir, 'TodoApp').deleteDir()
    }

    commandLine 'jpackage',
        '--type', 'app-image',
        '--name', 'TodoApp',
        '--input', inputDir,
        '--main-jar', mainJar,
        '--dest', outputDir
}

// 依存関係レポート（build.gradleに直接書いた依存の一覧）
tasks.register('dependencyReport') {
    def rootComponent = configurations.runtimeClasspath.incoming.resolutionResult.rootComponent
    doLast {
        rootComponent.get().dependencies.each { dep ->
            println dep.requested.displayName
        }
    }
}
